name: Feature request
description: Propose a capability or change to the open-source substrate engine.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        troth is the open substrate engine. Autonomy/body, voice, and the
        native app live in the closed product — see the feature matrix in the
        README before proposing those here.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? What's the underlying need?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Sketch the shape if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: thesis
    attributes:
      label: Fit with the thesis
      options:
        - label: This keeps the substrate as the subject and the LLM as interchangeable faculty.
