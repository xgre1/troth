# Daily distribution check: the version the world downloads must match the
# version this repository carries. The appcast is the site's machine surface
# (version + artifact sha), package.json is this tree's; drift in either
# direction turns this badge red within a day, and the download link is
# probed while we are here. Scheduled workflows do not run on forks.
name: Parity
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: Published vs repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: The version the world downloads is the version this tree carries
        run: |
          set -eu
          APPCAST=$(curl -sSf --max-time 30 https://troth.one/api/appcast)
          SITE_VERSION=$(printf '%s' "$APPCAST" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).version))")
          REPO_VERSION=$(node -p "require('./package.json').version")
          echo "site serves: $SITE_VERSION | repository: $REPO_VERSION"
          if [ "$SITE_VERSION" != "$REPO_VERSION" ]; then
            echo "::error::version drift — the site serves $SITE_VERSION but the open repository is $REPO_VERSION. One of them is behind."
            exit 1
          fi

      - name: The download link answers
        run: |
          set -eu
          URL=$(curl -sSf --max-time 30 https://troth.one/api/appcast | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).dmg_url))")
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 60 -r 0-1023 "$URL")
          echo "download probe: $CODE ($URL)"
          # A datacenter runner sees the edge's bot armor, not the file: 403 here
          # means the route resolved and the edge answered — a user's browser
          # passes where curl-from-a-runner cannot. Dead is 404/5xx/unreachable.
          case "$CODE" in 200|206|403) : ;; *) echo "::error::the download link is dead: $CODE"; exit 1 ;; esac
