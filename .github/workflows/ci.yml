name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege: the test job only needs to read the repo.
permissions:
  contents: read

# One live run per branch: a newer push replaces the queued/running one.
# Runs were stacking 40+ minutes deep in the queue because every push kept
# every older run alive — the suite itself needs under a minute.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os == 'macos-latest' && 'macOS' || 'Linux' }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both shipped platforms on every push. Hosted macOS runners are
        # free on public repositories, so the 10x-minutes argument that
        # once kept this Linux-only no longer applies — and the first run
        # of a suite on a platform must never be the run the public sees
        # fail (2026-08-15: three checks green on every Mac went red on
        # the open repo's first-ever Linux pass, post-publish).
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Reproducible install from the committed lockfile. tree-sitter is an
      # optional native dep; ubuntu-latest ships the build toolchain, so the
      # full parser path is exercised here.
      - name: Install
        run: npm ci

      - name: Test suite
        run: npm test

      - name: Standards conformance
        run: npm run test:standards
